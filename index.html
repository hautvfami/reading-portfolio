ags":["fiction"],"cover":"covers/b2e74886-cf89-4634-afd4-7f129895995d.jpg"}];
    const grid = document.getElementById('booksGrid');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');

    function renderBooks(filtered) {
      grid.innerHTML = '';
      if (filtered.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      filtered.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';

        const tagsHtml = (book.tags || []).slice(0, 3)
          .map(t => '<span class="tag-chip">' + escapeHtml(t) + '</span>').join('');

        card.innerHTML = `
          <div class="cover-container">
            <img class="cover-img" src="${book.cover}" alt="${escapeHtml(book.title)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
            <div class="cover-placeholder" style="display:none;">📖</div>
          </div>
          <div class="book-info">
            <h3 class="book-title">${escapeHtml(book.title)}</h3>
            <div class="book-author">${escapeHtml(book.author)}</div>
            ${tagsHtml ? '<div class="tags-list">' + tagsHtml + '</div>' : ''}
            <div class="progress-section">
              <div class="progress-meta">
                <span>Reading Progress</span>
                <span>${book.progress}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${book.progress}%"></div>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = books.filter(b => 
        b.title.toLowerCase().includes(q) ||
        b.author.toLowerCase().includes(q) ||
        (b.tags && b.tags.some(t => t.toLowerCase().includes(q)))
      );
      renderBooks(filtered);
    });

    renderBooks(books);
  </script>
